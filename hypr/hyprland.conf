monitor=,preferred,auto,1

# ---Startup execution of tools---
# Toolbar
exec-once = waybar

# Wallpaper Daemon
exec = swaybg -i /home/kecs/Documents/Wallpapers/wallpaper.jpg

#xss-lock for linking swaylock to systemd for locking upon lid close
exec = xss-lock swaylock

#block bluetooth to disable it after boot
exec = rfkill block bluetooth

#enable polkit authentification agent
exec-once=/usr/lib/polkit-gnome-authentication-agent-1

#synchronize dotfiles at boot
exec-once= bash ~/dotfiles/update-dotfiles.sh fromLocal

#source = ~/.config/hypr/myColors.conf

# Environment Variables
env = XCURSOR_SIZE,24

input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0.1 # -1.0 - 1.0, 0 means no modification.
}

general {

    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {

    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

gestures {
    workspace_swipe = on
}

# Window rules

# Floating and placement of LogOutMan
windowrule=float,title:^(LOGOUT_MAN)(.*)$
windowrule=move 25 50,title:^(LOGOUT_MAN)(.*)$

# Force red border on xwayland applications
windowrulev2 = bordercolor rgb(ff5555),xwayland:1 # check if window is xwayland

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

bind = $mainMod, RETURN, exec, alacritty
bind = $mainMod, Q, killactive, 
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating, 
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, L, movefocus, l
bind = $mainMod, H, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Logout Command bind
bind = $mainMod, O,exec, /home/kecs/Documents/Wallpapers/LogOutMan

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume control bindings
bind = $mainMod, COMMA, exec,pamixer -d 10 & notify-send Volume "Volume -10%"
bind = $mainMod, PERIOD, exec,pamixer -i 10 & notify-send Volume "Volume +10%"
bind = $mainMod, MINUS, exec,pamixer -t & notify-send Volume "Mute toggled"

# Brightness control bindings
bind = $mainMod, ODIAERESIS, exec, brightnessctl set 10%- & notify-send Brightness "Brightness -10%"
bind = $mainMod, ADIAERESIS, exec, brightnessctl set +10% & notify-send Brightness "Brightness +10%"

# Screenshot binding
bind = $mainMod, S, exec, grim -g$"$(slurp)"

# disable mouse pasting
bind = , mouse:274, exec, ;

# dracula/hyprland
general {
    col.active_border = rgb(44475a) rgb(bd93f9) 90deg
    col.inactive_border = rgba(44475aaa)
    col.nogroup_border = rgba(282a36dd)
    col.nogroup_border_active = rgb(bd93f9) rgb(44475a) 90deg
    no_border_on_floating = false
    border_size = 2
}

decoration {
    col.shadow = rgba(1E202966)

    #suggested shadow setting
    drop_shadow = yes
    shadow_range = 60
    shadow_offset = 1 2
    shadow_render_power = 3
    shadow_scale = 0.97
}

group {
    groupbar {
        col.active = rgb(bd93f9) rgb(44475a) 90deg
        col.inactive = rgba(282a36dd)
    }
}

